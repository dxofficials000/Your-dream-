<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- No <link rel> to this page anywhere on the public site on purpose. -->
<title>Admin — What's Your Dream</title>
<link rel="stylesheet" href="style.css">
<meta name="robots" content="noindex, nofollow">
</head>
<body>

<main>
  <div class="auth-card">
    <h1>Admin</h1>
    <p class="section-sub" style="margin-bottom:22px;">Owner access only.</p>

    <form id="admin-login-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Log in</button>
      <p class="status-msg" id="status-msg"></p>
    </form>
    <div class="auth-switch">
      <a href="#" id="forgot-link">Forgot password?</a>
    </div>
  </div>
</main>

<script type="module">
  import { auth, ADMIN_EMAIL, signInWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged, signOut } from "./firebase.js";

  // If already logged in as the admin, skip straight to the dashboard.
  onAuthStateChanged(auth, (user) => {
    if (user && user.email === ADMIN_EMAIL) {
      window.location.href = "admin-dashboard.html";
    }
  });

  function setStatus(msg, type = "") {
    const el = document.getElementById("status-msg");
    el.textContent = msg;
    el.className = "status-msg" + (type ? " " + type : "");
  }

  document.getElementById("forgot-link").addEventListener("click", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    if (!email) {
      setStatus("Type your email above first, then tap 'Forgot password?' again.", "error");
      return;
    }
    try {
      await sendPasswordResetEmail(auth, email);
      setStatus("Password reset email sent — check your inbox.", "success");
    } catch (err) {
      console.error(err);
      setStatus("Couldn't send a reset email for that address.", "error");
    }
  });

  document.getElementById("admin-login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const submitBtn = document.getElementById("submit-btn");
    submitBtn.disabled = true;
    setStatus("");

    try {
      const cred = await signInWithEmailAndPassword(auth, email, password);
      if (cred.user.email !== ADMIN_EMAIL) {
        await signOut(auth);
        setStatus("This account isn't authorized for admin access.", "error");
        submitBtn.disabled = false;
        return;
      }
      window.location.href = "admin-dashboard.html";
    } catch (err) {
      console.error(err);
      setStatus("Incorrect email or password.", "error");
      submitBtn.disabled = false;
    }
  });
</script>

</body>
</html>
