<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dream — What's Your Dream</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="site-nav">
  <a href="index.html" class="brand">What's Your Dream</a>
  <button class="hamburger-btn" id="hamburger-btn" aria-label="Menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
</nav>
<div class="nav-scrim" id="nav-scrim"></div>
<nav class="nav-menu" id="nav-menu">
  <a href="index.html">Home</a>
  <a href="explore.html">Explore</a>
  <a href="submit.html">Submit</a>
  <a href="about.html">About</a>
  <a href="auth.html" class="nav-cta" id="nav-auth-link" style="margin-top:16px; text-align:center; border:none;">Log in</a>
</nav>

<main>
  <div class="container-narrow">
    <div id="entry-content">
      <div class="empty-state">Loading entry…</div>
    </div>

    <div class="vote-panel">
      <div>
        <div class="count" id="vote-count">0</div>
        <div class="rank-meta">votes</div>
      </div>
      <button class="btn btn-primary" id="vote-btn">▲ Vote</button>
    </div>

    <h2 class="section-title">Comments</h2>
    <form id="comment-form" class="field" style="display:flex; gap:10px; margin-bottom:0;">
      <input type="text" id="comment-input" placeholder="Say something..." style="flex:1;">
      <button type="submit" class="btn btn-outline">Reply</button>
    </form>
    <div class="comment-list" id="comment-list">
      <div class="empty-state">Loading comments…</div>
    </div>
  </div>
</main>

<footer class="site-footer">
  Created by <a href="https://dxofficials000.github.io/dxofficials/" target="_blank" rel="noopener">DxOfficials</a>
</footer>
<script src="nav.js"></script>

<script type="module">
  import {
    auth, db, onAuthStateChanged,
    doc, getDoc, collection, addDoc, query, orderBy, onSnapshot,
    serverTimestamp, setDoc, getDocs, updateDoc, increment, requireAuth, guardActiveUser
  } from "./firebase.js";

  const params = new URLSearchParams(window.location.search);
  const entryId = params.get("id");
  let currentUser = null;

  if (!entryId) {
    document.getElementById("entry-content").innerHTML =
      `<div class="empty-state">No entry specified.</div>`;
  }

  onAuthStateChanged(auth, async (user) => {
    if (user && !(await guardActiveUser(user))) return;
    currentUser = user;
    const navLink = document.getElementById("nav-auth-link");
    if (user) {
      navLink.textContent = "My account";
      navLink.href = "account.html";
    }
    if (entryId) checkVoteState();
  });

  function timeAgo(date) {
    if (!date) return "";
    const diff = Math.floor((Date.now() - date.getTime()) / 1000);
    if (diff < 60) return "just now";
    if (diff < 3600) return Math.floor(diff / 60) + "m ago";
    if (diff < 86400) return Math.floor(diff / 3600) + "h ago";
    return Math.floor(diff / 86400) + "d ago";
  }

  async function loadEntry() {
    const container = document.getElementById("entry-content");
    try {
      const snap = await getDoc(doc(db, "entries", entryId));
      if (!snap.exists()) {
        container.innerHTML = `<div class="empty-state">This entry doesn't exist or was removed.</div>`;
        return;
      }
      const e = snap.data();
      document.getElementById("vote-count").textContent = e.voteCount || 0;

      if (e.type === "video") {
        container.innerHTML = `
          <div class="entry-media"><video src="${e.mediaUrl}" controls playsinline></video></div>
          <div class="rank-name" style="font-size:1.1rem;">${e.uploaderName || "Anonymous"}</div>
          <div class="rank-meta">${timeAgo(e.createdAt?.toDate?.())}</div>
        `;
      } else {
        container.innerHTML = `
          <div class="entry-text-block">${e.textContent}</div>
          <div class="rank-name" style="font-size:1.1rem; margin-top:10px;">${e.uploaderName || "Anonymous"}</div>
          <div class="rank-meta">${timeAgo(e.createdAt?.toDate?.())}</div>
        `;
      }
    } catch (err) {
      console.error(err);
      container.innerHTML = `<div class="empty-state">Couldn't load this entry.</div>`;
    }
  }

  // One vote doc per user, keyed by their uid — this is what stops
  // someone from voting 50 times by clicking repeatedly or refreshing.
  async function checkVoteState() {
    const voteBtn = document.getElementById("vote-btn");
    if (!currentUser) { voteBtn.textContent = "▲ Vote"; return; }
    const voteRef = doc(db, "entries", entryId, "votes", currentUser.uid);
    const voteSnap = await getDoc(voteRef);
    if (voteSnap.exists()) {
      voteBtn.textContent = "✓ Voted";
      voteBtn.disabled = true;
    }
  }

  document.getElementById("vote-btn").addEventListener("click", async () => {
    if (!requireAuth(currentUser, "vote")) return;
    const voteBtn = document.getElementById("vote-btn");
    voteBtn.disabled = true;
    try {
      const voteRef = doc(db, "entries", entryId, "votes", currentUser.uid);
      const existing = await getDoc(voteRef);
      if (existing.exists()) {
        voteBtn.textContent = "✓ Voted";
        return;
      }
      await setDoc(voteRef, { createdAt: serverTimestamp() });
      await updateDoc(doc(db, "entries", entryId), { voteCount: increment(1) });
      voteBtn.textContent = "✓ Voted";
      const countEl = document.getElementById("vote-count");
      countEl.textContent = (parseInt(countEl.textContent) || 0) + 1;
    } catch (err) {
      console.error(err);
      voteBtn.disabled = false;
      alert("Couldn't register your vote. Please try again.");
    }
  });

  function loadComments() {
    const list = document.getElementById("comment-list");
    const q = query(collection(db, "entries", entryId, "comments"), orderBy("createdAt", "desc"));
    onSnapshot(q, (snap) => {
      if (snap.empty) {
        list.innerHTML = `<div class="empty-state">No comments yet — be the first to reply.</div>`;
        return;
      }
      list.innerHTML = "";
      snap.forEach(docSnap => {
        const c = docSnap.data();
        const el = document.createElement("div");
        el.className = "comment";
        el.innerHTML = `
          <div class="author">${c.authorName || "Anonymous"}</div>
          <div class="body">${c.text}</div>
          <div class="time">${timeAgo(c.createdAt?.toDate?.())}</div>
        `;
        list.appendChild(el);
      });
    }, (err) => {
      console.error(err);
      list.innerHTML = `<div class="empty-state">Couldn't load comments.</div>`;
    });
  }

  document.getElementById("comment-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!requireAuth(currentUser, "comment")) return;
    const input = document.getElementById("comment-input");
    const text = input.value.trim();
    if (!text) return;
    try {
      await addDoc(collection(db, "entries", entryId, "comments"), {
        text,
        authorUid: currentUser.uid,
        authorName: currentUser.displayName || "Anonymous",
        createdAt: serverTimestamp()
      });
      input.value = "";
    } catch (err) {
      console.error(err);
      alert("Couldn't post your comment. Please try again.");
    }
  });

  if (entryId) {
    loadEntry();
    loadComments();
  }
</script>

</body>
</html>
