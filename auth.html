<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — What's Your Dream</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Catches any JavaScript error on this page and shows it right here. -->
<div id="error-banner" style="display:none; background:#4a0f1a; color:#ff9b9b; padding:14px 16px; font-size:0.85rem; font-family:monospace; white-space:pre-wrap; word-break:break-word; border-bottom:1px solid #C81E3A;"></div>
<script>
  function showPageError(msg) {
    var el = document.getElementById("error-banner");
    el.style.display = "block";
    el.textContent = "⚠️ Page error: " + msg;
  }
  window.addEventListener("error", function (e) {
    showPageError((e.message || "Unknown error") + " (line " + e.lineno + ")");
  });
  window.addEventListener("unhandledrejection", function (e) {
    showPageError(e.reason && e.reason.message ? e.reason.message : String(e.reason));
  });
</script>

<nav class="site-nav">
  <a href="index.html" class="brand">What's Your Dream</a>
  <button class="hamburger-btn" id="hamburger-btn" aria-label="Menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
</nav>
<div class="nav-scrim" id="nav-scrim"></div>
<nav class="nav-menu" id="nav-menu">
  <a href="index.html">Home</a>
  <a href="explore.html">Explore</a>
  <a href="submit.html">Submit</a>
  <a href="about.html">About</a>
</nav>

<main>
  <div class="auth-card">
    <h1 id="form-title">Log in</h1>
    <p class="section-sub" id="form-sub" style="margin-bottom:22px;">Welcome back — vote, comment, and submit.</p>

    <form id="auth-form">
      <div class="field" id="name-field" style="display:none;">
        <label for="name">Display name</label>
        <input type="text" id="name" placeholder="What should people see?">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Log in</button>
      <p class="status-msg" id="status-msg"></p>
    </form>

    <div class="auth-switch">
      <a href="#" id="forgot-link">Forgot password?</a>
    </div>
    <div class="auth-switch">
      <span id="switch-text">Don't have an account?</span>
      <a href="#" id="switch-link">Sign up</a>
    </div>
  </div>
</main>

<footer class="site-footer">
  Created by <a href="https://dxofficials000.github.io/dxofficials/" target="_blank" rel="noopener">DxOfficials</a>
</footer>
<script src="nav.js"></script>

<script type="module">
  import {
    auth, db, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail,
    updateProfile, onAuthStateChanged, doc, setDoc, serverTimestamp, guardActiveUser
  } from "./firebase.js";

  let mode = "login";

  onAuthStateChanged(auth, async (user) => {
    if (!user) return;
    if (!(await guardActiveUser(user))) return; // deactivated accounts get bounced home with a message
    window.location.href = "index.html";
  });

  const switchLink = document.getElementById("switch-link");
  switchLink.addEventListener("click", (e) => {
    e.preventDefault();
    mode = mode === "login" ? "signup" : "login";
    document.getElementById("form-title").textContent = mode === "login" ? "Log in" : "Sign up";
    document.getElementById("form-sub").textContent = mode === "login"
      ? "Welcome back — vote, comment, and submit."
      : "Create an account to submit, vote, and comment.";
    document.getElementById("submit-btn").textContent = mode === "login" ? "Log in" : "Sign up";
    document.getElementById("name-field").style.display = mode === "signup" ? "block" : "none";
    document.getElementById("switch-text").textContent = mode === "login" ? "Don't have an account?" : "Already have an account?";
    switchLink.textContent = mode === "login" ? "Sign up" : "Log in";
  });

  document.getElementById("forgot-link").addEventListener("click", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    if (!email) {
      setStatus("Type your email above first, then tap 'Forgot password?' again.", "error");
      return;
    }
    try {
      await sendPasswordResetEmail(auth, email);
      setStatus("Password reset email sent — check your inbox.", "success");
    } catch (err) {
      console.error(err);
      setStatus("Couldn't send a reset email for that address.", "error");
    }
  });

  function setStatus(msg, type = "") {
    const el = document.getElementById("status-msg");
    el.textContent = msg;
    el.className = "status-msg" + (type ? " " + type : "");
  }

  document.getElementById("auth-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const submitBtn = document.getElementById("submit-btn");
    submitBtn.disabled = true;
    setStatus("");

    try {
      if (mode === "signup") {
        const name = document.getElementById("name").value.trim();
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        if (name) await updateProfile(cred.user, { displayName: name });
        // Profile doc so the admin dashboard can list/deactivate this user.
        await setDoc(doc(db, "users", cred.user.uid), {
          email,
          displayName: name || "",
          createdAt: serverTimestamp(),
          active: true
        });
      } else {
        await signInWithEmailAndPassword(auth, email, password);
      }
      window.location.href = "index.html";
    } catch (err) {
      console.error(err);
      let msg = "Something went wrong. Please try again.";
      if (err.code === "auth/email-already-in-use") msg = "That email is already registered — try logging in instead.";
      if (err.code === "auth/invalid-credential" || err.code === "auth/wrong-password") msg = "Incorrect email or password.";
      if (err.code === "auth/weak-password") msg = "Password should be at least 6 characters.";
      if (err.code === "auth/user-not-found") msg = "No account found with that email.";
      setStatus(msg, "error");
      submitBtn.disabled = false;
    }
  });
</script>

</body>
</html>
