<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All dreams — What's Your Dream</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="site-nav">
  <a href="index.html" class="brand">What's Your Dream</a>
  <button class="hamburger-btn" id="hamburger-btn" aria-label="Menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
</nav>
<div class="nav-scrim" id="nav-scrim"></div>
<nav class="nav-menu" id="nav-menu">
  <a href="index.html">Home</a>
  <a href="explore.html" class="active">Explore</a>
  <a href="submit.html">Submit</a>
  <a href="about.html">About</a>
  <a href="auth.html" class="nav-cta" id="nav-auth-link" style="margin-top:16px; text-align:center; border:none;">Log in</a>
</nav>

<main>
  <h1 class="section-title" style="margin-top:40px;">All dreams</h1>
  <p class="section-sub">Every dream shared on the platform, newest first. Tap one to watch, read, comment, and vote.</p>
  <div class="leaderboard" id="entry-list">
    <div class="empty-state">Loading…</div>
  </div>
</main>

<footer class="site-footer">
  Created by <a href="https://dxofficials000.github.io/dxofficials/" target="_blank" rel="noopener">DxOfficials</a>
</footer>
<script src="nav.js"></script>

<script type="module">
  import { auth, db, onAuthStateChanged, collection, query, orderBy, getDocs } from "./firebase.js";

  onAuthStateChanged(auth, (user) => {
    const navLink = document.getElementById("nav-auth-link");
    if (user) {
      navLink.textContent = "My account";
      navLink.href = "account.html";
    }
  });

  function timeAgo(date) {
    if (!date) return "";
    const diff = Math.floor((Date.now() - date.getTime()) / 1000);
    if (diff < 60) return "just now";
    if (diff < 3600) return Math.floor(diff / 60) + "m ago";
    if (diff < 86400) return Math.floor(diff / 3600) + "h ago";
    return Math.floor(diff / 86400) + "d ago";
  }

  async function loadAll() {
    const list = document.getElementById("entry-list");
    try {
      const q = query(collection(db, "entries"), orderBy("createdAt", "desc"));
      const snap = await getDocs(q);
      if (snap.empty) {
        list.innerHTML = `<div class="empty-state">No dreams shared yet — be the first.</div>`;
        return;
      }
      list.innerHTML = "";
      snap.forEach(docSnap => {
        const e = docSnap.data();
        const row = document.createElement("a");
        row.href = `entry.html?id=${docSnap.id}`;
        row.className = "rank-row";
        row.style.gridTemplateColumns = "44px 1fr auto";
        row.innerHTML = `
          <div class="rank-num" style="font-size:1.3rem;">${e.type === "video" ? "🎥" : "✍️"}</div>
          <div>
            <div class="rank-name">${e.uploaderName || "Anonymous"}</div>
            <div class="rank-meta">${e.type === "video" ? "Video" : "Text"} · ${timeAgo(e.createdAt?.toDate?.())}</div>
          </div>
          <div class="vote-count">${e.voteCount || 0} votes</div>
        `;
        list.appendChild(row);
      });
    } catch (err) {
      console.error(err);
      list.innerHTML = `<div class="empty-state">Couldn't load dreams right now.</div>`;
    }
  }

  loadAll();
</script>

</body>
</html>
